name: Compile diagnostics

# TEMPORARY diagnostic workflow: the sandbox cannot read Actions logs (the log archive is served
# from a host it cannot reach), so this publishes the Kotlin compiler errors as check-run
# annotations, which the GitHub API does expose. Delete once the build is green.

on:
  push:
    branches: [ "arena/c4d183d8-lm-arena" ]

permissions:
  contents: read
  checks: write

jobs:
  diag:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compile and publish errors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x gradlew || true
          set +e
          ./gradlew :app:compileDebugKotlin --no-daemon --console=plain > /tmp/compile.log 2>&1
          status=$?
          set -e
          echo "gradle exit: $status"
          tail -60 /tmp/compile.log || true
          python3 - "$status" <<'PY'
          import json, os, re, sys

          status = sys.argv[1]
          text = open('/tmp/compile.log', errors='replace').read()
          text = re.sub(r'\x1b\[[0-9;]*m', '', text)
          lines = text.splitlines()
          errors = [l for l in lines if l.startswith('e: ') or ' error: ' in l]
          if not errors:
              errors = [l for l in lines if 'FAILED' in l or 'Could not' in l][-40:]
          summary = ('gradle exit %s\n' % status + '\n'.join(errors))[:60000]
          payload = {
              'name': 'compile diagnostics',
              'head_sha': os.environ['GITHUB_SHA'],
              'status': 'completed',
              'conclusion': 'neutral',
              'output': {
                  'title': 'Kotlin compile errors',
                  'summary': summary,
              },
          }
          open('/tmp/check.json', 'w').write(json.dumps(payload))
          print('errors captured:', len(errors))
          PY
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" --method POST --input /tmp/check.json > /dev/null
          exit 0
