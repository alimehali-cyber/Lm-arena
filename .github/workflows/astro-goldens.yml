name: Astronomy bit-identity baseline

# Records the SHA-256 fingerprints AstroBitIdentityTest compares against, from the engine code of the
# commit that triggered the run, and commits them to app/src/test/resources/astro-goldens.txt.
# Re-recording an existing baseline requires an explicit request: a workflow_dispatch run with
# `rebaseline: true`, or a push whose commit message starts with `test(astro): rebaseline`. Ordinary
# pushes skip the job below and never overwrite the baseline.
on:
  push:
  workflow_dispatch:
    inputs:
      rebaseline:
        description: "Explicitly regenerate the astronomy fingerprint baseline from this branch"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  record:
    # A push only earns a recorder run when its commit message asks for one; everything else is a
    # skipped job, not a wasted checkout.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'test(astro): rebaseline')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Record the baseline
        env:
          ASTRO_GOLDENS_RECORD: "true"
          REBASELINE: ${{ inputs.rebaseline }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            commit_message=$(python3 -c 'import json, os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"])).get("head_commit", {}).get("message", ""))')
            if [[ "$commit_message" == "test(astro): rebaseline"* ]]; then
              REBASELINE=true
            fi
          fi
          if [ "$REBASELINE" = "true" ]; then
            echo "Explicit rebaseline requested; replacing the fingerprint file from this commit."
            rm -f app/src/test/resources/astro-goldens.txt
          fi
          if [ -f app/src/test/resources/astro-goldens.txt ]; then
            echo "baseline already recorded; no rebaseline requested"
            exit 0
          fi
          chmod +x gradlew || true
          ./gradlew testDebugUnitTest --tests '*AstroBitIdentityTest*' --rerun \
            -Pgravity.ci.tests=false --no-daemon
          test -s app/src/test/resources/astro-goldens.txt
          echo "::notice title=Astro baseline::$(grep -vc '^#' app/src/test/resources/astro-goldens.txt) fingerprints recorded"

      - name: Commit the baseline
        run: |
          git config user.name "astro-goldens-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/resources/astro-goldens.txt
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "test(astro): bit-identity baseline recorded from ${GITHUB_SHA::7}"
          for i in 1 2 3; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
