name: Astronomy bit-identity baseline

# Records the SHA-256 fingerprints AstroBitIdentityTest compares against, from the engine code of the
# commit that triggered the run, and commits them to app/src/test/resources/astro-goldens.txt.
# The test refuses to overwrite an existing baseline, so this can only ever record the first one (or a
# deliberate re-baseline after the file has been deleted). Runs only when this workflow file changes.
on:
  push:
    paths:
      - ".github/workflows/astro-goldens.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Record the baseline
        env:
          ASTRO_GOLDENS_RECORD: "true"
        run: |
          if [ -f app/src/test/resources/astro-goldens.txt ]; then
            echo "baseline already recorded; nothing to do"
            exit 0
          fi
          chmod +x gradlew || true
          ./gradlew testDebugUnitTest --tests '*AstroBitIdentityTest*' --rerun \
            -Pgravity.ci.tests=false --no-daemon
          test -s app/src/test/resources/astro-goldens.txt
          echo "::notice title=Astro baseline::$(grep -vc '^#' app/src/test/resources/astro-goldens.txt) fingerprints recorded"

      - name: Commit the baseline
        run: |
          git config user.name "astro-goldens-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/resources/astro-goldens.txt
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "test(astro): bit-identity baseline recorded from ${GITHUB_SHA::7}"
          for i in 1 2 3; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1

