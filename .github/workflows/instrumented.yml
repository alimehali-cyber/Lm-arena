name: instrumented

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
  pull_request:
  workflow_dispatch:

# Tier B (roadmap §24.3) instrumented CI emulator workflow, per Appendix H.2
# (docs/Space_Museum_Roadmap.pdf, "H.2 WORKFLOW 2 — TIER B (CI emulator with KVM; correctness
# and interaction only)  File: .github/workflows/instrumented.yml").
#
# This file did NOT exist before this pass (only build.yml and museum-gates.yml did), so per the
# correction to Fix Prompt v2 it is built fresh here, matching Appendix H.2's base job structure
# and emulator flags/profile verbatim (runs-on ubuntu-latest, KVM udev step, api-level 34, x86_64,
# profile pixel_6, emulator-options "-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
# -camera-back none", disable-animations: true) rather than improvising a different profile/flag
# set. It is extended (not duplicated) with what the roadmap's own Appendix H.2 script step and
# H.5 rules leave to the implementer: which instrumented test class to run, JUnit-result gating on
# the two required Space Museum rendering tests, and uploading the actual rendered screenshot PNGs
# in addition to the emulator-screenshots directory pattern the appendix sketches.
#
# JDK: kept at Temurin 21 (matching build.yml's already-working, previously-verified-in-CI
# toolchain for this repo's AGP 9.1.1 / Gradle 9.3.1 setup) rather than Appendix H's illustrative
# "17", per Appendix I's own instruction to adapt sketches to what the real repository actually
# needs rather than pasting blindly — this is a toolchain-version adaptation, not a deviation from
# the emulator/profile spec the correction called out.
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Grant execute permission for gradlew (if present)
        run: chmod +x gradlew || true

      # Foundational Rebuild Phase 0.3/1.1: this job builds and runs the real debug app +
      # instrumented test APKs (connectedDebugAndroidTest below), which per
      # core/engine/build.gradle.kts's compileFilamat task depend on mergeDebugAssets, which in
      # turn depends on compileFilamat. Without FILAMENT_MATC set here (mirroring build.yml's
      # "Install matc" step), compileFilamat silently no-ops (FILAMENT_MATC unset means
      # matcRequired=false) and core/engine/src/main/assets/filamat/m1SurfaceLit.filamat is never
      # produced -- confirmed by a real CI run (commit 8dc7b49, check-run 104383850708) whose
      # InspectorEngine logcat showed "Phase 1 material load failed: FileNotFoundException:
      # filamat/m1SurfaceLit.filamat" for BOTH earth and mars, meaning neither object ever
      # exercised the real Phase 1.1 material path in this job and both silently fell back to the
      # shared runtime ensureMaterial() material instead. Installing matc here (same approach as
      # build.yml) ensures this job's APK actually contains the real offline-compiled material,
      # which the Phase 1.4 golden-image test needs to be a meaningful check at all.
      - name: Install matc (Filament 1.71.5 material compiler)
        run: |
          set -euo pipefail
          FILAMENT_VERSION="1.71.5"
          DEST="$RUNNER_TEMP/filament-matc"
          mkdir -p "$DEST"
          curl -fL --retry 3 -o "$DEST/filament-linux.tgz" \
            "https://github.com/google/filament/releases/download/v${FILAMENT_VERSION}/filament-v${FILAMENT_VERSION}-linux.tgz"
          tar -xzf "$DEST/filament-linux.tgz" -C "$DEST"
          MATC_BIN="$(find "$DEST" -type f -name matc -perm -u+x | head -n1)"
          if [ -z "$MATC_BIN" ]; then
            MATC_BIN="$(find "$DEST" -type f -name matc | head -n1)"
          fi
          if [ -z "$MATC_BIN" ]; then
            echo "::error title=matc install failed::Could not locate a matc binary inside filament-v${FILAMENT_VERSION}-linux.tgz after extraction."
            find "$DEST" -maxdepth 4 -type d
            exit 1
          fi
          chmod +x "$MATC_BIN"
          echo "Found matc at $MATC_BIN"
          MATC_HELP_EXIT=0
          "$MATC_BIN" --help >/tmp/matc-help.log 2>&1 || MATC_HELP_EXIT=$?
          if [ "$MATC_HELP_EXIT" -ne 0 ]; then
            HELP_ENCODED="$(sed 's/%/%25/g; s/\r/%0D/g' /tmp/matc-help.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=matc invocation failed::matc found at ${MATC_BIN}. --help exit=${MATC_HELP_EXIT}. help_log=${HELP_ENCODED}"
            cat /tmp/matc-help.log
            exit 1
          fi
          echo "matc --help succeeded, binary is genuinely runnable on this runner (ubuntu-latest)."
          echo "FILAMENT_MATC=$MATC_BIN" >> "$GITHUB_ENV"

      # api-level 34 / x86_64 / pixel_6 / emulator-options, verbatim from Appendix H.2. minSdk=24,
      # targetSdk=36 (app/build.gradle.kts) both bracket API 34 comfortably.
      - name: Instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb logcat -c || true
            GRADLE_EXIT=0
            # -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true: AGP's
            # connectedAndroidTest task uninstalls both the app-under-test and test APKs as its
            # own last step (default since AGP 8.1, see
            # https://issuetracker.google.com/issues/295039976). Without this flag, by the time
            # this script reaches the `adb shell run-as` calls below the package is already gone,
            # so run-as fails with "unknown package: com.alijafari.red.astronomy" even though the
            # test itself passed and wrote the screenshots before uninstall. This is a Gradle
            # invocation flag only -- no gradle.properties, build.gradle.kts, or app code change.
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.alijafari.red.astronomy.SpaceMuseumRenderingInstrumentedTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --no-daemon || GRADLE_EXIT=$?
            adb logcat -d -v time > "$RUNNER_TEMP/space-museum-logcat.txt" 2>/dev/null || true
            mkdir -p "$RUNNER_TEMP/space-museum-screenshots"
            # Plain `adb pull` on /sdcard/Android/data/<pkg>/... commonly fails ("No such file or
            # directory") for the unprivileged `shell` user on scoped-storage emulator images even
            # though the app-private directory is real, because `shell` cannot traverse into
            # another app's external-files directory without root. The debug build under test is
            # debuggable, so use `run-as` (the standard non-root way to reach an app's private
            # storage) to tar the directory out instead, with a plain `adb pull` fallback in case
            # a future image behaves differently.
            adb shell "run-as com.alijafari.red.astronomy sh -c 'cd /storage/emulated/0/Android/data/com.alijafari.red.astronomy/files 2>/dev/null && tar -cf /data/local/tmp/space_museum_screenshots.tar space_museum_screenshots 2>/dev/null'" || true
            adb pull /data/local/tmp/space_museum_screenshots.tar "$RUNNER_TEMP/space_museum_screenshots.tar" 2>/dev/null || true
            if [ -f "$RUNNER_TEMP/space_museum_screenshots.tar" ]; then tar -xf "$RUNNER_TEMP/space_museum_screenshots.tar" -C "$RUNNER_TEMP/space-museum-screenshots" --strip-components=1 || true; fi
            adb pull /sdcard/Android/data/com.alijafari.red.astronomy/files/space_museum_screenshots "$RUNNER_TEMP/space-museum-screenshots" 2>/dev/null || true
            echo "--- Screenshot pull diagnostics ---"
            adb shell "run-as com.alijafari.red.astronomy ls -la files/space_museum_screenshots" 2>&1 || true
            ls -la "$RUNNER_TEMP/space-museum-screenshots" || true
            exit $GRADLE_EXIT

      # Print the relevant logcat lines directly into the job log (not just the uploaded
      # artifact) so failures are diagnosable from `gh api .../check-runs/{id}/annotations` and
      # the job log text alone, without needing to download a zip artifact.
      - name: Print filtered logcat for diagnosis
        if: always()
        run: |
          echo "--- SpaceMuseumTest / AndroidRuntime / Compose / FATAL / InspectorEngine lines from device logcat ---"
          grep -E "SpaceMuseumTest|AndroidRuntime|FATAL EXCEPTION|ActivityManager|Compose|zig\.museum|alijafari|InspectorEngine" "$RUNNER_TEMP/space-museum-logcat.txt" | tail -n 400 || true

          # Foundational Rebuild Phase 0.2 diagnostic: the fingerprint-identity failure between
          # earth and mars (see SpaceMuseumRenderingInstrumentedTest's cross-object fingerprint
          # check) needs InspectorEngine's own real logcat lines (lastError, "Renderable SUCCESS
          # for <objectId>", "Phase 1 m1SurfaceLit material + textures loaded from assets", etc.)
          # to diagnose without a real device -- this sandbox cannot run an emulator directly, so
          # emitting these into a ::error::/::notice:: annotation (reachable via
          # `gh api .../check-runs/{id}/annotations`, unlike the raw job log which is blocked by
          # an unreachable Azure blob host from this sandbox's network) is the only way to see
          # this evidence.
          echo "--- Emitting InspectorEngine lines as GitHub annotations for gh api visibility ---"
          python3 - "$RUNNER_TEMP/space-museum-logcat.txt" <<'PY'
          import re
          import sys

          path = sys.argv[1]
          try:
              with open(path, errors="replace") as f:
                  lines = f.readlines()
          except FileNotFoundError:
              print(f"::warning title=logcat missing::{path} not found")
              sys.exit(0)

          interesting = [l.rstrip("\n") for l in lines if re.search(
              r"InspectorEngine|Renderable SUCCESS|Phase 1 m1SurfaceLit|lastError|beginFrame|"
              r"createSwapChain|LIT MaterialBuilder|UNLIT MaterialBuilder|Simple MaterialBuilder|"
              r"createDefaultMaterial", l)]

          def emit(title, text_lines):
              text = "\n".join(text_lines)
              text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              for i in range(0, max(len(text), 1), 3000):
                  chunk = text[i:i + 3000]
                  suffix = "" if i + 3000 >= len(text) else " [continues]"
                  print(f"::notice title={title}::{chunk}{suffix}")

          if interesting:
              # Chunk into groups of ~15 lines per annotation to stay well under any single
              # annotation's own size limits while keeping call count reasonable.
              group_size = 15
              for i in range(0, len(interesting), group_size):
                  emit(f"InspectorEngine logcat {i // group_size + 1}", interesting[i:i + group_size])
          else:
              print("::warning title=InspectorEngine logcat::No InspectorEngine-related lines found in logcat at all.")
          PY

      # Appendix H.2 notes: "swiftshader_indirect means software rendering. Never quote timings
      # from this job." Nothing in this job or the test it runs measures frame rate/thermals; the
      # instrumented test only asserts on captured pixel colors (non-uniform + luminance
      # gradient), which is within Tier B's documented use ("screenshot capture of every object as
      # smoke evidence", roadmap §24.3). Per §24.7, a pass here is reported as Tier B SMOKE
      # evidence that the geometry renders with non-uniform, light-responsive pixels — not as
      # "golden images pass" or a visual-quality certification, which require Tier C/D.
      - name: Report instrumented test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          required = [
              "com.alijafari.red.astronomy.SpaceMuseumRenderingInstrumentedTest#earthRendersNonUniformFrameWithDirectionalShading",
              "com.alijafari.red.astronomy.SpaceMuseumRenderingInstrumentedTest#marsRendersNonUniformFrameWithDirectionalShading",
          ]
          files = sorted(glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True))
          print(f"Connected AndroidTest XML files: {len(files)}")
          seen = {}
          for path in files:
              root = ET.parse(path).getroot()
              for testcase in root.iter("testcase"):
                  classname = testcase.attrib.get("classname", "")
                  name = testcase.attrib.get("name", "")
                  key = f"{classname}#{name}"
                  failure = testcase.find("failure")
                  error = testcase.find("error")
                  skipped = testcase.find("skipped")
                  status = "PASS"
                  message = ""
                  if failure is not None:
                      status = "FAIL"
                      message = failure.attrib.get("message", "") or (failure.text or "")
                  elif error is not None:
                      status = "ERROR"
                      message = error.attrib.get("message", "") or (error.text or "")
                  elif skipped is not None:
                      status = "SKIPPED"
                  seen[key] = (status, message)
                  print(f"{key}: {status}")
                  if message:
                      print(f"  {message[:2000]}")

          failed = False
          for key in required:
              if key not in seen:
                  print(f"::error title=Missing instrumented test::{key} did not run or was not reported")
                  failed = True
              elif seen[key][0] != "PASS":
                  status, message = seen[key]
                  text = f"{key}: {status} {message}".replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  # Foundational Rebuild Phase 0.2: this message now carries fullBitmapSha256 and
                  # renderLoopAtCapture diagnostic fields (see
                  # SpaceMuseumRenderingInstrumentedTest.kt's RenderFingerprint) that are long
                  # enough to get silently cut off by a single 900-char truncation -- chunk
                  # instead of truncating so the conclusive identicalFullBitmap=true/false
                  # evidence at the end of the message is never lost.
                  for i in range(0, len(text), 3000):
                      chunk = text[i:i + 3000]
                      suffix = "" if i + 3000 >= len(text) else " [continues]"
                      print(f"::error title=Instrumented test failed::{chunk}{suffix}")
                  failed = True
              else:
                  print(f"::notice title=Instrumented test passed (Tier B smoke evidence only)::{key}")
          if failed:
              sys.exit("One or more required Space Museum instrumented rendering tests were missing or failed")
          PY

      - name: Upload instrumented test results (JUnit XML + logcat)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: space-museum-instrumented-test-results
          path: |
            app/build/outputs/androidTest-results/connected/**/*.xml
            app/build/reports/androidTests/connected/**
            ${{ runner.temp }}/space-museum-logcat.txt
          if-no-files-found: warn

      # Appendix H.2 sketches `path: '**/screenshots/**'` for a generic emulator-screenshots
      # artifact; this repo's actual instrumented test writes PNGs under the app's external files
      # dir (see SpaceMuseumRenderingInstrumentedTest.kt), pulled above into $RUNNER_TEMP, so the
      # path here is adapted to where this repo's screenshots actually land (Appendix I's "adapt
      # to the file you actually read" principle applied to this appendix's own sketch).
      - name: Upload rendered screenshot PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: space-museum-screenshots
          path: ${{ runner.temp }}/space-museum-screenshots/**
          if-no-files-found: warn
