name: instrumented

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
  pull_request:
  workflow_dispatch:

# Tier B (roadmap §24.3) instrumented CI emulator workflow, per Appendix H.2
# (docs/Space_Museum_Roadmap.pdf, "H.2 WORKFLOW 2 — TIER B (CI emulator with KVM; correctness
# and interaction only)  File: .github/workflows/instrumented.yml").
#
# This file did NOT exist before this pass (only build.yml and museum-gates.yml did), so per the
# correction to Fix Prompt v2 it is built fresh here, matching Appendix H.2's base job structure
# and emulator flags/profile verbatim (runs-on ubuntu-latest, KVM udev step, api-level 34, x86_64,
# profile pixel_6, emulator-options "-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
# -camera-back none", disable-animations: true) rather than improvising a different profile/flag
# set. It is extended (not duplicated) with what the roadmap's own Appendix H.2 script step and
# H.5 rules leave to the implementer: which instrumented test class to run, JUnit-result gating on
# the two required Space Museum rendering tests, and uploading the actual rendered screenshot PNGs
# in addition to the emulator-screenshots directory pattern the appendix sketches.
#
# JDK: kept at Temurin 21 (matching build.yml's already-working, previously-verified-in-CI
# toolchain for this repo's AGP 9.1.1 / Gradle 9.3.1 setup) rather than Appendix H's illustrative
# "17", per Appendix I's own instruction to adapt sketches to what the real repository actually
# needs rather than pasting blindly — this is a toolchain-version adaptation, not a deviation from
# the emulator/profile spec the correction called out.
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Grant execute permission for gradlew (if present)
        run: chmod +x gradlew || true

      # api-level 34 / x86_64 / pixel_6 / emulator-options, verbatim from Appendix H.2. minSdk=24,
      # targetSdk=36 (app/build.gradle.kts) both bracket API 34 comfortably.
      - name: Instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb logcat -c || true
            GRADLE_EXIT=0
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.alijafari.red.astronomy.SpaceMuseumRenderingInstrumentedTest --no-daemon || GRADLE_EXIT=$?
            adb logcat -d -v time > "$RUNNER_TEMP/space-museum-logcat.txt" 2>/dev/null || true
            mkdir -p "$RUNNER_TEMP/space-museum-screenshots"
            # Plain `adb pull` on /sdcard/Android/data/<pkg>/... commonly fails ("No such file or
            # directory") for the unprivileged `shell` user on scoped-storage emulator images even
            # though the app-private directory is real, because `shell` cannot traverse into
            # another app's external-files directory without root. The debug build under test is
            # debuggable, so use `run-as` (the standard non-root way to reach an app's private
            # storage) to tar the directory out instead, with a plain `adb pull` fallback in case
            # a future image behaves differently.
            adb shell "run-as com.alijafari.red.astronomy sh -c 'cd /storage/emulated/0/Android/data/com.alijafari.red.astronomy/files 2>/dev/null && tar -cf /data/local/tmp/space_museum_screenshots.tar space_museum_screenshots 2>/dev/null'" || true
            adb pull /data/local/tmp/space_museum_screenshots.tar "$RUNNER_TEMP/space_museum_screenshots.tar" 2>/dev/null || true
            if [ -f "$RUNNER_TEMP/space_museum_screenshots.tar" ]; then tar -xf "$RUNNER_TEMP/space_museum_screenshots.tar" -C "$RUNNER_TEMP/space-museum-screenshots" --strip-components=1 || true; fi
            adb pull /sdcard/Android/data/com.alijafari.red.astronomy/files/space_museum_screenshots "$RUNNER_TEMP/space-museum-screenshots" 2>/dev/null || true
            echo "--- Screenshot pull diagnostics ---"
            adb shell "run-as com.alijafari.red.astronomy ls -la files/space_museum_screenshots" 2>&1 || true
            ls -la "$RUNNER_TEMP/space-museum-screenshots" || true
            exit $GRADLE_EXIT

      # Print the relevant logcat lines directly into the job log (not just the uploaded
      # artifact) so failures are diagnosable from `gh api .../check-runs/{id}/annotations` and
      # the job log text alone, without needing to download a zip artifact.
      - name: Print filtered logcat for diagnosis
        if: always()
        run: |
          echo "--- SpaceMuseumTest / AndroidRuntime / Compose / FATAL lines from device logcat ---"
          grep -E "SpaceMuseumTest|AndroidRuntime|FATAL EXCEPTION|ActivityManager|Compose|zig\.museum|alijafari" "$RUNNER_TEMP/space-museum-logcat.txt" | tail -n 400 || true

      # Appendix H.2 notes: "swiftshader_indirect means software rendering. Never quote timings
      # from this job." Nothing in this job or the test it runs measures frame rate/thermals; the
      # instrumented test only asserts on captured pixel colors (non-uniform + luminance
      # gradient), which is within Tier B's documented use ("screenshot capture of every object as
      # smoke evidence", roadmap §24.3). Per §24.7, a pass here is reported as Tier B SMOKE
      # evidence that the geometry renders with non-uniform, light-responsive pixels — not as
      # "golden images pass" or a visual-quality certification, which require Tier C/D.
      - name: Report instrumented test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          required = [
              "com.alijafari.red.astronomy.SpaceMuseumRenderingInstrumentedTest#earthRendersNonUniformFrameWithDirectionalShading",
              "com.alijafari.red.astronomy.SpaceMuseumRenderingInstrumentedTest#marsRendersNonUniformFrameWithDirectionalShading",
          ]
          files = sorted(glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True))
          print(f"Connected AndroidTest XML files: {len(files)}")
          seen = {}
          for path in files:
              root = ET.parse(path).getroot()
              for testcase in root.iter("testcase"):
                  classname = testcase.attrib.get("classname", "")
                  name = testcase.attrib.get("name", "")
                  key = f"{classname}#{name}"
                  failure = testcase.find("failure")
                  error = testcase.find("error")
                  skipped = testcase.find("skipped")
                  status = "PASS"
                  message = ""
                  if failure is not None:
                      status = "FAIL"
                      message = failure.attrib.get("message", "") or (failure.text or "")
                  elif error is not None:
                      status = "ERROR"
                      message = error.attrib.get("message", "") or (error.text or "")
                  elif skipped is not None:
                      status = "SKIPPED"
                  seen[key] = (status, message)
                  print(f"{key}: {status}")
                  if message:
                      print(f"  {message[:2000]}")

          failed = False
          for key in required:
              if key not in seen:
                  print(f"::error title=Missing instrumented test::{key} did not run or was not reported")
                  failed = True
              elif seen[key][0] != "PASS":
                  status, message = seen[key]
                  text = f"{key}: {status} {message}".replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")[:900]
                  print(f"::error title=Instrumented test failed::{text}")
                  failed = True
              else:
                  print(f"::notice title=Instrumented test passed (Tier B smoke evidence only)::{key}")
          if failed:
              sys.exit("One or more required Space Museum instrumented rendering tests were missing or failed")
          PY

      - name: Upload instrumented test results (JUnit XML + logcat)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: space-museum-instrumented-test-results
          path: |
            app/build/outputs/androidTest-results/connected/**/*.xml
            app/build/reports/androidTests/connected/**
            ${{ runner.temp }}/space-museum-logcat.txt
          if-no-files-found: warn

      # Appendix H.2 sketches `path: '**/screenshots/**'` for a generic emulator-screenshots
      # artifact; this repo's actual instrumented test writes PNGs under the app's external files
      # dir (see SpaceMuseumRenderingInstrumentedTest.kt), pulled above into $RUNNER_TEMP, so the
      # path here is adapted to where this repo's screenshots actually land (Appendix I's "adapt
      # to the file you actually read" principle applied to this appendix's own sketch).
      - name: Upload rendered screenshot PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: space-museum-screenshots
          path: ${{ runner.temp }}/space-museum-screenshots/**
          if-no-files-found: warn
