name: Build Android APK

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Grant execute permission for gradlew (if present)
        run: chmod +x gradlew || true

      - name: Restore debug.keystore if present
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

      - name: Build APK with Gradle (single deliverable — DEBUG)
        run: |
          set -eo pipefail
          # assembleDebug is THE deliverable. assembleRelease is compiled only as an
          # internal input for the debug-only dex assertion below (it proves the
          # field-trial classes are absent from release); it is NEVER uploaded —
          # the workflow publishes exactly one APK artifact: the debug build.
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle_build.log
          else
            gradle assembleDebug assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle_build.log
          fi

      - name: Build log artifact (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log
          if-no-files-found: ignore

      - name: Diagnostic - List Generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f

      - name: D4 - assert debug-only screen absent from release APK (dex inspection)
        run: |
          debug_apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          release_apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "debug apk:   $debug_apk"
          echo "release apk: $release_apk"
          [ -n "$debug_apk" ] && [ -n "$release_apk" ]
          .github/scripts/assert_debug_only.sh "$debug_apk" "$release_apk"

      - name: Upload debug APK artifact (the only APK artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Rolling pre-release with the DEBUG APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-debug-apk
          name: "CI debug APK (rolling)"
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Unit tests (THE gate, T1)
        run: |
          set -eo pipefail
          # -Pgravity.ci.tests=false disables the default com.zig.gravity.* test filter
          # (app/build.gradle.kts gates every Test task on that property) so the WHOLE
          # unit-test suite runs.
          ./gradlew :app:testDebugUnitTest --continue -Pgravity.ci.tests=false 2>&1 | tee unit_test.log

      - name: Extract compile errors (if any)
        if: failure()
        run: |
          grep -E '^e: |error: ' unit_test.log | head -30 | while IFS= read -r l; do
            m=$(echo "$l" | sed 's/%/%25/g; s/:/%3A/g' | head -c 1500)
            echo "::notice title=compile_error::$m"
          done || true

      - name: Summarize JUnit results as annotations
        if: always()
        run: python3 .github/scripts/junit_summary.py

      - name: Upload JUnit XML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml
          path: app/build/test-results/**/*.xml
          if-no-files-found: warn

      - name: Upload unit-test log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log
          path: unit_test.log
          if-no-files-found: ignore
