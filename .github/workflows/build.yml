name: Build Android APK

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
  pull_request:
  workflow_dispatch:

# Single real-app build job: unit tests -> signed release APK -> artifact upload.
#
# The instrumented emulator smoke-test job (AVD boot + connectedDebugAndroidTest + logcat gate for
# ARSkySmokeInstrumentedTest) has been removed from the pipeline. Nothing here depends on an
# emulator, and there are no `needs:` gates. Local/JVM unit tests (testDebugUnitTest) are retained
# and remain a hard gate before the APK is produced.
jobs:
  build:
    # Foundational Rebuild Phase 0.3: bumped from ubuntu-22.04 to ubuntu-24.04.
    #
    # Root cause of the "Install matc" step failing here (confirmed via a diagnostic CI run,
    # commit a748edf, check-run 104372100009's "matc invocation failed" annotation): the
    # pinned Filament 1.71.5 linux matc binary requires GLIBC_2.38
    # ("/lib/x86_64-linux-gnu/libc.so.6: version `GLIBC_2.38' not found"), but ubuntu-22.04
    # only ships glibc 2.35. This is an environment mismatch, not a bad download URL or bad
    # extraction path -- matc itself was found and located correctly.
    #
    # ubuntu-24.04's glibc is 2.39 (>= 2.38, satisfies matc), and its preinstalled Android SDK
    # image includes build-tools 36.0.0/36.1.0 and platform android-36.1, which matches this
    # project's compileSdk 36.1 (app/build.gradle.kts) -- so this is a real fix, not a runtime
    # MaterialBuilder/GLSL-string workaround for matc, and does not require any other toolchain
    # change (AGP/Kotlin/Gradle/JDK all remain the same real repo versions per
    # docs/decisions/DECISIONS.md).
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Grant execute permission for gradlew (if present)
        run: chmod +x gradlew || true

      # Foundational Rebuild Phase 0.3: install the real matc material compiler matching the
      # pinned Filament 1.71.5 dependency version (see core/engine/build.gradle.kts) so
      # compileFilamat can produce real offline .filamat output instead of silently no-op'ing
      # and leaving the runtime MaterialBuilder/GLSL-string path as the only material pipeline
      # (see docs/audit/MILESTONE_AUDIT.md, M1/M4: matc had never been installed/invoked anywhere
      # in CI prior to this). Per the Foundational Rebuild instructions, if matc genuinely cannot
      # be made to work here this must be a hard stop reported to the owner, not a silent
      # fallback -- so this step fails the build (does not `|| true` past errors) if download,
      # extraction, or a basic --help invocation fail.
      - name: Install matc (Filament 1.71.5 material compiler)
        run: |
          set -euo pipefail
          FILAMENT_VERSION="1.71.5"
          DEST="$RUNNER_TEMP/filament-matc"
          mkdir -p "$DEST"
          curl -fL --retry 3 -o "$DEST/filament-linux.tgz" \
            "https://github.com/google/filament/releases/download/v${FILAMENT_VERSION}/filament-v${FILAMENT_VERSION}-linux.tgz"
          tar -xzf "$DEST/filament-linux.tgz" -C "$DEST"
          MATC_BIN="$(find "$DEST" -type f -name matc -perm -u+x | head -n1)"
          if [ -z "$MATC_BIN" ]; then
            MATC_BIN="$(find "$DEST" -type f -name matc | head -n1)"
          fi
          if [ -z "$MATC_BIN" ]; then
            echo "::error title=matc install failed::Could not locate a matc binary inside filament-v${FILAMENT_VERSION}-linux.tgz after extraction. This is the S2 hard-stop condition from the roadmap: matc must not be silently worked around with the runtime MaterialBuilder/GLSL-string path. Reporting to owner, failing build."
            find "$DEST" -maxdepth 4 -type d
            exit 1
          fi
          chmod +x "$MATC_BIN"
          echo "Found matc at $MATC_BIN"
          ldd "$MATC_BIN" > /tmp/matc-ldd.log 2>&1 || true
          echo "---- ldd output ----"
          cat /tmp/matc-ldd.log
          echo "---------------------"
          MATC_HELP_EXIT=0
          "$MATC_BIN" --help >/tmp/matc-help.log 2>&1 || MATC_HELP_EXIT=$?
          if [ "$MATC_HELP_EXIT" -ne 0 ]; then
            HELP_ENCODED="$(sed 's/%/%25/g; s/\r/%0D/g' /tmp/matc-help.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            LDD_ENCODED="$(sed 's/%/%25/g; s/\r/%0D/g' /tmp/matc-ldd.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=matc invocation failed::matc found at ${MATC_BIN}. --help exit=${MATC_HELP_EXIT}. help_log=${HELP_ENCODED} ldd_log=${LDD_ENCODED}"
            echo "==== FULL matc --help failure log (raw) ===="
            cat /tmp/matc-help.log
            echo "==== FULL ldd output (raw) ===="
            cat /tmp/matc-ldd.log
            echo "==== uname / os-release ===="
            uname -a
            cat /etc/os-release || true
            exit 1
          fi
          echo "matc --help succeeded, binary is genuinely runnable on this runner."
          echo "FILAMENT_MATC=$MATC_BIN" >> "$GITHUB_ENV"

      - name: Decode permanent signing keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for secret_name in SIGNING_KEY_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error title=Missing signing secret::${secret_name} is required for installable update APKs."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          test -s "$RUNNER_TEMP/keystore.jks"
          echo "Permanent signing keystore decoded."

      - name: Run full unit test suite
        shell: bash
        run: |
          set -o pipefail
          if [ -f "./gradlew" ]; then
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi
          set +e
          "$GRADLE_CMD" testDebugUnitTest -Pgravity.ci.tests=false --no-daemon 2>&1 | tee "$RUNNER_TEMP/unit-test-gradle.log"
          unit_status=${PIPESTATUS[0]}
          set -e
          python3 - "$unit_status" "$RUNNER_TEMP/unit-test-gradle.log" <<'PY'
          import glob
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          unit_status = int(sys.argv[1])
          log_path = pathlib.Path(sys.argv[2])
          files = sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml"))
          tests = failures = errors = skipped = 0
          failed_cases = []
          for path in files:
              root = ET.parse(path).getroot()
              for testcase in root.iter("testcase"):
                  tests += 1
                  failure = testcase.find("failure")
                  error = testcase.find("error")
                  skipped_node = testcase.find("skipped")
                  if failure is not None:
                      failures += 1
                      failed_cases.append((testcase.attrib.get("classname", ""), testcase.attrib.get("name", ""), failure.attrib.get("message", "")))
                  if error is not None:
                      errors += 1
                      failed_cases.append((testcase.attrib.get("classname", ""), testcase.attrib.get("name", ""), error.attrib.get("message", "")))
                  if skipped_node is not None:
                      skipped += 1
          print(f"::notice title=Full unit test suite::tests={tests} failures={failures} errors={errors} skipped={skipped} files={len(files)} gradle_status={unit_status}")
          for classname, name, message in failed_cases[:40]:
              text = f"{classname}.{name}: {message}".replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")[:900]
              print(f"::error title=Unit test failure::{text}")
          if unit_status != 0 and not failed_cases:
              lines = log_path.read_text(errors="replace").splitlines() if log_path.exists() else []

              def emit(title, text_lines):
                  text = "\n".join(text_lines)
                  text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  # GitHub annotation messages are truncated well beyond typical Gradle output;
                  # chunk defensively at 3000 chars so nothing silently gets cut without a marker.
                  for i in range(0, len(text), 3000):
                      chunk = text[i:i + 3000]
                      suffix = "" if i + 3000 >= len(text) else " [continues]"
                      print(f"::error title={title}::{chunk}{suffix}")

              # Foundational Rebuild Phase 0.3: the previous version of this diagnostic only
              # grepped individual lines matching a token list and truncated each to 900 chars --
              # this hid the actual "* What went wrong:" / GradleException message body (e.g. from
              # core/engine/build.gradle.kts's compileFilamat task, or matc's own stdout/stderr
              # printed via println(output) before it) whenever the message spanned multiple lines
              # or exceeded 900 chars. Now: locate the "* What went wrong:" block (Gradle's own
              # standard failure-summary marker) and emit it in full via emit() above, in addition
              # to the previous single-line token scan for anything before that marker.
              wwiw_idx = next((i for i, l in enumerate(lines) if l.strip() == "* What went wrong:"), None)
              if wwiw_idx is not None:
                  block = lines[wwiw_idx:wwiw_idx + 80]
                  # Stop at the next '* Try:' / '* Exception is:' / BUILD FAILED section boundary if present sooner.
                  end = next((j for j, l in enumerate(block) if j > 0 and l.strip().startswith("* ") and l.strip() != "* What went wrong:"), len(block))
                  emit("Gradle failure: What went wrong", block[:end])

              # Foundational Rebuild Phase 0.3: core/engine/build.gradle.kts's compileFilamat task
              # prints matc's own raw stdout/stderr via println(output) between its "Compiling
              # X.mat -> X.filamat via ..." and "matc failed for X.mat with exit N" lines -- this
              # is the actual matc compiler error (e.g. a shader validation error with line
              # numbers) and is not caught by either the token scan above or the "What went wrong"
              # block (which only contains compileFilamat's own summary GradleException message,
              # not matc's underlying compiler output). Surface it explicitly.
              compiling_idx = next((i for i, l in enumerate(lines) if l.strip().startswith("Compiling ") and " via " in l), None)
              if compiling_idx is not None:
                  matc_block = lines[compiling_idx:compiling_idx + 120]
                  end = next((j for j, l in enumerate(matc_block) if j > 0 and (l.strip().startswith("> Task") or l.strip().startswith("* What went wrong"))), len(matc_block))
                  emit("matc compiler output for m1SurfaceLit.mat", matc_block[:end])
              interesting = [line for line in lines if any(token in line for token in ("FAILURE:", "Execution failed", "FAILED", "Exception", "error:", "No tests found", "BUILD FAILED")) or line.startswith("e: ")]
              for line in interesting[-40:]:
                  text = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")[:900]
                  print(f"::error title=Unit Gradle output::{text}")
          PY
          exit "$unit_status"

      - name: Confirm AR/catalog unit test classes
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          required = [
              "com.alijafari.red.astronomy.ARDeepSkyMergeTest",
              "com.alijafari.red.astronomy.ARDistanceFormatterTest",
              "com.alijafari.red.astronomy.MagneticAnomalyDetectorTest",
              "com.alijafari.red.astronomy.ARRecalibrationPromptTest",
              "com.alijafari.red.astronomy.AROnePointAlignmentTest",
              "com.alijafari.red.astronomy.ARCalibrationPromptTest",
              "com.alijafari.red.astronomy.SkyOrientationProjectionTest",
              "com.alijafari.red.astronomy.SatelliteARConsistencyTest",
              "com.alijafari.red.astronomy.CatalogIntegrityTest",
              "com.alijafari.red.astronomy.DeepSkyFactCoverageTest",
              "com.alijafari.red.astronomy.ObjectDetailModalConsistencyTest",
              "com.alijafari.red.astronomy.ContentIntegrityAuditTest",
              "com.alijafari.red.astronomy.ARSkyEarthExclusionTest",
              "com.alijafari.red.astronomy.ARSkyPointToShapeRenderingTest",
              "com.alijafari.red.astronomy.VazirmatnPersianTypographyTest",
          ]
          stats = {name: {"tests": 0, "failures": 0, "errors": 0, "skipped": 0} for name in required}
          files = sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml"))
          print(f"JUnit XML files: {len(files)}")
          for path in files:
              root = ET.parse(path).getroot()
              for testcase in root.iter("testcase"):
                  classname = testcase.attrib.get("classname", "")
                  if classname in stats:
                      stats[classname]["tests"] += 1
                      if testcase.find("failure") is not None:
                          stats[classname]["failures"] += 1
                      if testcase.find("error") is not None:
                          stats[classname]["errors"] += 1
                      if testcase.find("skipped") is not None:
                          stats[classname]["skipped"] += 1

          failed = False
          for name in required:
              s = stats[name]
              status = "PASS" if s["tests"] > 0 and s["failures"] == 0 and s["errors"] == 0 and s["skipped"] == 0 else "FAIL"
              print(f"{name}: tests={s['tests']} failures={s['failures']} errors={s['errors']} skipped={s['skipped']} status={status}")
              print(f"::notice title=AR unit test class::{name}: tests={s['tests']} failures={s['failures']} errors={s['errors']} skipped={s['skipped']} status={status}")
              if status != "PASS":
                  failed = True
          if failed:
              sys.exit("One or more required AR unit test classes were missing, skipped, or failed")
          PY

      - name: Build signed release APK with Gradle
        env:
          KEYSTORE_FILE_PATH: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi

      - name: Prepare signed real app APK artifact
        shell: bash
        run: |
          set -euo pipefail
          apk_candidates=()
          while IFS= read -r apk; do
            apk_candidates+=("$apk")
          done < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*-release.apk" ! -name "*androidTest*" | sort)

          if [ "${#apk_candidates[@]}" -ne 1 ]; then
            echo "::error title=APK artifact selection::Expected exactly one real release app APK, found ${#apk_candidates[@]}: ${apk_candidates[*]:-none}"
            find app/build/outputs/apk -type f -name "*.apk" -print || true
            exit 1
          fi

          app_apk="${apk_candidates[0]}"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          badging="$($aapt dump badging "$app_apk" | head -n 1)"
          echo "$badging"
          if [[ "$badging" != *"name='com.alijafari.red.astronomy'"* ]]; then
            echo "::error title=APK package mismatch::Real app APK must use package com.alijafari.red.astronomy"
            exit 1
          fi
          if [[ "$badging" != *"versionCode='4'"* ]]; then
            echo "::error title=APK version mismatch::Expected versionCode 4 for update over earlier installed builds."
            exit 1
          fi
          "$apksigner" verify --print-certs "$app_apk" | tee "$RUNNER_TEMP/apksigner-certs.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/apksigner-certs.txt"; then
            echo "::error title=Wrong signing key::Real app APK was signed with the temporary Android debug key instead of the permanent repository signing key."
            exit 1
          fi
          grep -E "Signer #1 certificate SHA-256 digest|Verified using" "$RUNNER_TEMP/apksigner-certs.txt" || true

          rm -rf "$RUNNER_TEMP/real-app-apk"
          mkdir -p "$RUNNER_TEMP/real-app-apk"
          cp "$app_apk" "$RUNNER_TEMP/real-app-apk/ZIG-release.apk"
          file_count="$(find "$RUNNER_TEMP/real-app-apk" -type f | wc -l | tr -d ' ')"
          if [ "$file_count" != "1" ]; then
            echo "::error title=APK artifact selection::Only the real app APK may be uploaded."
            exit 1
          fi
          echo "Prepared artifact with exactly one installable, permanent-key-signed APK: ZIG-release.apk"

      - name: Diagnostic - List Generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f

      - name: Upload real app APK only
        uses: actions/upload-artifact@v4
        with:
          name: ZIG-real-app-apk
          path: ${{ runner.temp }}/real-app-apk/ZIG-release.apk
          if-no-files-found: error

      - name: Clean up keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/keystore.jks"
