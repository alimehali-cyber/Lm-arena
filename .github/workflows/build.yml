name: Build Android APK

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Grant execute permission for gradlew (if present)
        run: chmod +x gradlew || true

      - name: Restore debug.keystore if present
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

      - name: Build APK with Gradle
        run: |
          set -eo pipefail
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_build.log
          else
            gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_build.log
          fi

      - name: Publish build log on failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=5 origin "$GITHUB_REF_NAME" || true
          git checkout "$GITHUB_REF_NAME" 2>/dev/null || git checkout -b "$GITHUB_REF_NAME" origin/"$GITHUB_REF_NAME"
          mkdir -p buildlogs
          cp gradle_build.log "buildlogs/${GITHUB_SHA:0:8}.log" 2>/dev/null || true
          # also capture compile errors from any daemon logs if present
          git add buildlogs
          git commit -m "ci: build log for ${GITHUB_SHA:0:8} [skip ci]" || echo "nothing to commit"
          git push origin "$GITHUB_REF_NAME" || echo "log push failed"

      - name: Diagnostic - List Generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Deliver APK via git branch (ci/apk)
        if: success()
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "no APK found"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin ci/apk || true
          git checkout --orphan ci/apk || git checkout ci/apk
          git rm -rf --quiet . 2>/dev/null || true
          cp "$APK" ./app-debug.apk
          SHA=$(git rev-parse HEAD 2>/dev/null || echo none)
          echo "$GITHUB_SHA" > BUILD_INFO.txt
          git add app-debug.apk BUILD_INFO.txt
          git commit -m "ci: APK from $GITHUB_SHA [skip ci]" || echo "no changes"
          git push origin ci/apk --force

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Unit tests (THE gate, T1)
        run: |
          set -eo pipefail
          ./gradlew :app:testDebugUnitTest --continue 2>&1 | tee unit_test.log

      - name: Extract compile errors (if any)
        if: failure()
        run: |
          grep -E '^e: |error: ' unit_test.log | head -30 | while IFS= read -r l; do
            m=$(echo "$l" | sed 's/%/%25/g; s/:/%3A/g' | head -c 1500)
            echo "::notice title=compile_error::$m"
          done || true

      - name: Summarize JUnit results as annotations
        if: always()
        run: python3 .github/scripts/junit_summary.py

      - name: Upload JUnit XML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml
          path: app/build/test-results/**/*.xml
          if-no-files-found: warn

      - name: Upload unit-test log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log
          path: unit_test.log
          if-no-files-found: ignore
