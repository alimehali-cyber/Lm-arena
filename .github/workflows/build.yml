name: Build Android APK

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Pin to 22.04 because reactivecircus/android-emulator-runner has known
    # AVD creation issues on ubuntu-latest/24.04.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Grant execute permission for gradlew (if present)
        run: chmod +x gradlew || true

      - name: Decode permanent signing keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for secret_name in SIGNING_KEY_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error title=Missing signing secret::${secret_name} is required for installable update APKs."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          test -s "$RUNNER_TEMP/keystore.jks"
          echo "Permanent signing keystore decoded."

      - name: Run full unit test suite
        shell: bash
        run: |
          set -o pipefail
          if [ -f "./gradlew" ]; then
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi
          set +e
          "$GRADLE_CMD" testDebugUnitTest -Pgravity.ci.tests=false --no-daemon 2>&1 | tee "$RUNNER_TEMP/unit-test-gradle.log"
          unit_status=${PIPESTATUS[0]}
          set -e
          python3 - "$unit_status" "$RUNNER_TEMP/unit-test-gradle.log" <<'PY'
          import glob
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          unit_status = int(sys.argv[1])
          log_path = pathlib.Path(sys.argv[2])
          files = sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml"))
          tests = failures = errors = skipped = 0
          failed_cases = []
          for path in files:
              root = ET.parse(path).getroot()
              for testcase in root.iter("testcase"):
                  tests += 1
                  failure = testcase.find("failure")
                  error = testcase.find("error")
                  skipped_node = testcase.find("skipped")
                  if failure is not None:
                      failures += 1
                      failed_cases.append((testcase.attrib.get("classname", ""), testcase.attrib.get("name", ""), failure.attrib.get("message", "")))
                  if error is not None:
                      errors += 1
                      failed_cases.append((testcase.attrib.get("classname", ""), testcase.attrib.get("name", ""), error.attrib.get("message", "")))
                  if skipped_node is not None:
                      skipped += 1
          print(f"::notice title=Full unit test suite::tests={tests} failures={failures} errors={errors} skipped={skipped} files={len(files)} gradle_status={unit_status}")
          for classname, name, message in failed_cases[:40]:
              text = f"{classname}.{name}: {message}".replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")[:900]
              print(f"::error title=Unit test failure::{text}")
          if unit_status != 0 and not failed_cases:
              lines = log_path.read_text(errors="replace").splitlines() if log_path.exists() else []
              interesting = [line for line in lines if any(token in line for token in ("FAILURE:", "Execution failed", "FAILED", "Exception", "error:", "No tests found", "BUILD FAILED"))]
              for line in interesting[-40:]:
                  text = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")[:900]
                  print(f"::error title=Unit Gradle output::{text}")
          PY
          exit "$unit_status"

      - name: Confirm AR/catalog unit test classes
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          required = [
              "com.alijafari.red.astronomy.ARDeepSkyMergeTest",
              "com.alijafari.red.astronomy.ARDistanceFormatterTest",
              "com.alijafari.red.astronomy.MagneticAnomalyDetectorTest",
              "com.alijafari.red.astronomy.ARRecalibrationPromptTest",
              "com.alijafari.red.astronomy.AROnePointAlignmentTest",
              "com.alijafari.red.astronomy.ARCalibrationPromptTest",
              "com.alijafari.red.astronomy.SkyOrientationProjectionTest",
              "com.alijafari.red.astronomy.SatelliteARConsistencyTest",
              "com.alijafari.red.astronomy.CatalogIntegrityTest",
              "com.alijafari.red.astronomy.DeepSkyFactCoverageTest",
              "com.alijafari.red.astronomy.ObjectDetailModalConsistencyTest",
          ]
          stats = {name: {"tests": 0, "failures": 0, "errors": 0, "skipped": 0} for name in required}
          files = sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml"))
          print(f"JUnit XML files: {len(files)}")
          for path in files:
              root = ET.parse(path).getroot()
              for testcase in root.iter("testcase"):
                  classname = testcase.attrib.get("classname", "")
                  if classname in stats:
                      stats[classname]["tests"] += 1
                      if testcase.find("failure") is not None:
                          stats[classname]["failures"] += 1
                      if testcase.find("error") is not None:
                          stats[classname]["errors"] += 1
                      if testcase.find("skipped") is not None:
                          stats[classname]["skipped"] += 1

          failed = False
          for name in required:
              s = stats[name]
              status = "PASS" if s["tests"] > 0 and s["failures"] == 0 and s["errors"] == 0 and s["skipped"] == 0 else "FAIL"
              print(f"{name}: tests={s['tests']} failures={s['failures']} errors={s['errors']} skipped={s['skipped']} status={status}")
              print(f"::notice title=AR unit test class::{name}: tests={s['tests']} failures={s['failures']} errors={s['errors']} skipped={s['skipped']} status={status}")
              if status != "PASS":
                  failed = True
          if failed:
              sys.exit("One or more required AR unit test classes were missing, skipped, or failed")
          PY

      - name: Build APK with Gradle
        env:
          KEYSTORE_FILE_PATH: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Diagnostic - List Generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android emulator image
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP"
          exec > >(tee -a "$RUNNER_TEMP/ar-emulator-setup.log") 2>&1

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          if [ ! -x "$AVDMANAGER" ]; then
            AVDMANAGER="$(command -v avdmanager)"
          fi

          echo "ANDROID_HOME=${ANDROID_HOME}"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install             "platform-tools"             "emulator"             "platforms;android-34"             "system-images;android-34;google_apis;x86_64"

          "$AVDMANAGER" list device | sed -n '1,120p'
          echo "no" | "$AVDMANAGER" create avd             --force             --name ar-smoke             --package "system-images;android-34;google_apis;x86_64"             --device "pixel_2"
          printf 'hw.keyboard=yes\nhw.mainKeys=no\n' >> "$HOME/.android/avd/ar-smoke.avd/config.ini"

      - name: Run AR emulator smoke test
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP"
          : > "$RUNNER_TEMP/ar-smoke-logcat.txt"
          exec > >(tee -a "$RUNNER_TEMP/ar-emulator-startup.log") 2>&1

          EMULATOR="${ANDROID_HOME}/emulator/emulator"
          ADB="${ANDROID_HOME}/platform-tools/adb"
          if [ -f "./gradlew" ]; then
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi

          "$ADB" start-server
          "$EMULATOR" -avd ar-smoke             -no-window             -gpu swiftshader_indirect             -no-snapshot             -wipe-data             -noaudio             -no-boot-anim             -camera-back none &
          emulator_pid=$!
          cleanup() {
            "$ADB" -e emu kill || true
            kill "$emulator_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          "$ADB" wait-for-device
          booted=""
          for _ in {1..120}; do
            booted="$($ADB shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$booted" = "1" ]; then
              break
            fi
            sleep 2
          done
          echo "sys.boot_completed=${booted:-unset}"
          if [ "$booted" != "1" ]; then
            echo "Emulator did not boot within 240 seconds"
            exit 1
          fi

          "$ADB" shell input keyevent 82 || true
          "$ADB" shell settings put global window_animation_scale 0 || true
          "$ADB" shell settings put global transition_animation_scale 0 || true
          "$ADB" shell settings put global animator_duration_scale 0 || true
          "$ADB" logcat -c || true

          set +e
          "$GRADLE_CMD" connectedDebugAndroidTest             -Pandroid.testInstrumentationRunnerArguments.class=com.alijafari.red.astronomy.ARSkySmokeInstrumentedTest             --no-daemon 2>&1 | tee "$RUNNER_TEMP/ar-smoke-gradle.log"
          connected_status=${PIPESTATUS[0]}
          echo "::notice title=AR smoke Gradle status::connectedDebugAndroidTest status=${connected_status}"
          "$ADB" logcat -d -v time > "$RUNNER_TEMP/ar-smoke-logcat.txt" 2>/dev/null
          python3 - "$RUNNER_TEMP/ar-smoke-gradle.log" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          lines = path.read_text(errors="replace").splitlines() if path.exists() else []
          interesting = [
              line for line in lines
              if any(token in line for token in (
                  "FAILURE:", "Execution failed", "Exception", "error:", "No tests found",
                  "connectedDebugAndroidTest", "BUILD FAILED", "BUILD SUCCESSFUL", "ARSkySmoke"
              ))
          ]
          for line in interesting[-25:]:
              escaped = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")[:900]
              print(f"::notice title=AR smoke Gradle output::{escaped}")
          PY
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          files = sorted(glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True))
          print(f"Connected AndroidTest XML files: {len(files)}")
          for path in files[:20]:
              print(f"::notice title=AR smoke XML::{path}")
          tests = failures = errors = skipped = 0
          for path in files:
              root = ET.parse(path).getroot()
              for testcase in root.iter("testcase"):
                  if testcase.attrib.get("classname") == "com.alijafari.red.astronomy.ARSkySmokeInstrumentedTest":
                      tests += 1
                      failures += 1 if testcase.find("failure") is not None else 0
                      errors += 1 if testcase.find("error") is not None else 0
                      skipped += 1 if testcase.find("skipped") is not None else 0
          status = "PASS" if tests > 0 and failures == 0 and errors == 0 and skipped == 0 else "FAIL"
          print(f"ARSkySmokeInstrumentedTest: tests={tests} failures={failures} errors={errors} skipped={skipped} status={status}")
          print(f"::notice title=AR emulator smoke test::ARSkySmokeInstrumentedTest: tests={tests} failures={failures} errors={errors} skipped={skipped} status={status}")
          sys.exit(0 if status == "PASS" else 1)
          PY
          smoke_xml_status=$?
          set -e

          set +e
          python3 - "$RUNNER_TEMP/ar-smoke-logcat.txt" <<'PY'
          import pathlib
          import sys

          package = "com.alijafari.red.astronomy"
          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          app_fatal_blocks = []
          for index, line in enumerate(lines):
              if "FATAL EXCEPTION" not in line:
                  continue
              block = "\n".join(lines[index:index + 40])
              if package in block:
                  app_fatal_blocks.append(block)
          if app_fatal_blocks:
              print("App fatal exception detected during AR emulator smoke test")
              for block in app_fatal_blocks[:3]:
                  escaped = block.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")[:900]
                  print(f"::error title=AR emulator app fatal::{escaped}")
              sys.exit(1)
          print("No app fatal exceptions found in logcat during AR emulator smoke test")
          print("::notice title=AR emulator logcat::No app fatal exceptions found in logcat during AR emulator smoke test")
          PY
          fatal_status=$?
          set -e

          if [ "$connected_status" -ne 0 ] || [ "$smoke_xml_status" -ne 0 ] || [ "$fatal_status" -ne 0 ]; then
            echo "connectedDebugAndroidTest status=$connected_status smoke_xml_status=$smoke_xml_status fatal_status=$fatal_status"
            exit 1
          fi

      - name: Prepare signed real app APK artifact
        shell: bash
        run: |
          set -euo pipefail
          apk_candidates=()
          while IFS= read -r apk; do
            apk_candidates+=("$apk")
          done < <(find app/build/outputs/apk/debug -maxdepth 1 -type f -name "*-debug.apk" ! -name "*androidTest*" | sort)

          if [ "${#apk_candidates[@]}" -ne 1 ]; then
            echo "::error title=APK artifact selection::Expected exactly one real debug app APK, found ${#apk_candidates[@]}: ${apk_candidates[*]:-none}"
            find app/build/outputs/apk -type f -name "*.apk" -print || true
            exit 1
          fi

          app_apk="${apk_candidates[0]}"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          badging="$($aapt dump badging "$app_apk" | head -n 1)"
          echo "$badging"
          if [[ "$badging" != *"name='com.alijafari.red.astronomy'"* ]]; then
            echo "::error title=APK package mismatch::Real app APK must use package com.alijafari.red.astronomy"
            exit 1
          fi
          if [[ "$badging" != *"versionCode='3'"* ]]; then
            echo "::error title=APK version mismatch::Expected versionCode 3 for update over the currently installed build."
            exit 1
          fi
          "$apksigner" verify --print-certs "$app_apk" | tee "$RUNNER_TEMP/apksigner-certs.txt"
          grep -E "Signer #1 certificate SHA-256 digest|Verified using" "$RUNNER_TEMP/apksigner-certs.txt" || true

          rm -rf "$RUNNER_TEMP/real-app-apk"
          mkdir -p "$RUNNER_TEMP/real-app-apk"
          cp "$app_apk" "$RUNNER_TEMP/real-app-apk/ZIG-debug.apk"
          file_count="$(find "$RUNNER_TEMP/real-app-apk" -type f | wc -l | tr -d ' ')"
          if [ "$file_count" != "1" ]; then
            echo "::error title=APK artifact selection::Only the real app APK may be uploaded."
            exit 1
          fi
          echo "Prepared artifact with exactly one installable APK: ZIG-debug.apk"

      - name: Upload real app APK only
        uses: actions/upload-artifact@v4
        with:
          name: ZIG-real-app-apk
          path: ${{ runner.temp }}/real-app-apk/ZIG-debug.apk
          if-no-files-found: error

      - name: Clean up keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/keystore.jks"
