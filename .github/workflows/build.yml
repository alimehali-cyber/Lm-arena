name: Build Android APK

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Pin to 22.04 because reactivecircus/android-emulator-runner has known
    # AVD creation issues on ubuntu-latest/24.04.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Grant execute permission for gradlew (if present)
        run: chmod +x gradlew || true

      - name: Decode Keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
            echo "Permanent signing keystore decoded."
          else
            echo "No signing secret configured; Gradle will fall back to the debug key."
          fi

      - name: Run full unit test suite
        run: |
          if [ -f "./gradlew" ]; then
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi
          "$GRADLE_CMD" testDebugUnitTest -Pgravity.ci.tests=false --no-daemon

      - name: Confirm AR/catalog unit test classes
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          required = [
              "com.alijafari.red.astronomy.ARDeepSkyMergeTest",
              "com.alijafari.red.astronomy.ARDistanceFormatterTest",
              "com.alijafari.red.astronomy.MagneticAnomalyDetectorTest",
              "com.alijafari.red.astronomy.ARRecalibrationPromptTest",
              "com.alijafari.red.astronomy.AROnePointAlignmentTest",
              "com.alijafari.red.astronomy.ARCalibrationPromptTest",
              "com.alijafari.red.astronomy.SkyOrientationProjectionTest",
              "com.alijafari.red.astronomy.SatelliteARConsistencyTest",
              "com.alijafari.red.astronomy.CatalogIntegrityTest",
              "com.alijafari.red.astronomy.DeepSkyFactCoverageTest",
          ]
          stats = {name: {"tests": 0, "failures": 0, "errors": 0, "skipped": 0} for name in required}
          files = sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml"))
          print(f"JUnit XML files: {len(files)}")
          for path in files:
              root = ET.parse(path).getroot()
              for testcase in root.iter("testcase"):
                  classname = testcase.attrib.get("classname", "")
                  if classname in stats:
                      stats[classname]["tests"] += 1
                      if testcase.find("failure") is not None:
                          stats[classname]["failures"] += 1
                      if testcase.find("error") is not None:
                          stats[classname]["errors"] += 1
                      if testcase.find("skipped") is not None:
                          stats[classname]["skipped"] += 1

          failed = False
          for name in required:
              s = stats[name]
              status = "PASS" if s["tests"] > 0 and s["failures"] == 0 and s["errors"] == 0 and s["skipped"] == 0 else "FAIL"
              print(f"{name}: tests={s['tests']} failures={s['failures']} errors={s['errors']} skipped={s['skipped']} status={status}")
              print(f"::notice title=AR unit test class::{name}: tests={s['tests']} failures={s['failures']} errors={s['errors']} skipped={s['skipped']} status={status}")
              if status != "PASS":
                  failed = True
          if failed:
              sys.exit("One or more required AR unit test classes were missing, skipped, or failed")
          PY

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn

      - name: Build APK with Gradle
        env:
          KEYSTORE_FILE_PATH: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Diagnostic - List Generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android emulator image
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP"
          exec > >(tee -a "$RUNNER_TEMP/ar-emulator-setup.log") 2>&1

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          if [ ! -x "$AVDMANAGER" ]; then
            AVDMANAGER="$(command -v avdmanager)"
          fi

          echo "ANDROID_HOME=${ANDROID_HOME}"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install             "platform-tools"             "emulator"             "platforms;android-34"             "system-images;android-34;google_apis;x86_64"

          "$AVDMANAGER" list device | sed -n '1,120p'
          echo "no" | "$AVDMANAGER" create avd             --force             --name ar-smoke             --package "system-images;android-34;google_apis;x86_64"             --device "pixel_2"
          printf 'hw.keyboard=yes\nhw.mainKeys=no\n' >> "$HOME/.android/avd/ar-smoke.avd/config.ini"

      - name: Run AR emulator smoke test
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP"
          : > "$RUNNER_TEMP/ar-smoke-logcat.txt"
          exec > >(tee -a "$RUNNER_TEMP/ar-emulator-startup.log") 2>&1

          EMULATOR="${ANDROID_HOME}/emulator/emulator"
          ADB="${ANDROID_HOME}/platform-tools/adb"
          if [ -f "./gradlew" ]; then
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi

          "$ADB" start-server
          "$EMULATOR" -avd ar-smoke             -no-window             -gpu swiftshader_indirect             -no-snapshot             -wipe-data             -noaudio             -no-boot-anim             -camera-back none &
          emulator_pid=$!
          cleanup() {
            "$ADB" -e emu kill || true
            kill "$emulator_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          "$ADB" wait-for-device
          booted=""
          for _ in {1..120}; do
            booted="$($ADB shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$booted" = "1" ]; then
              break
            fi
            sleep 2
          done
          echo "sys.boot_completed=${booted:-unset}"
          if [ "$booted" != "1" ]; then
            echo "Emulator did not boot within 240 seconds"
            exit 1
          fi

          "$ADB" shell input keyevent 82 || true
          "$ADB" shell settings put global window_animation_scale 0 || true
          "$ADB" shell settings put global transition_animation_scale 0 || true
          "$ADB" shell settings put global animator_duration_scale 0 || true
          "$ADB" logcat -c || true

          set +e
          "$GRADLE_CMD" connectedDebugAndroidTest             -Pandroid.testInstrumentationRunnerArguments.class=com.alijafari.red.astronomy.ARSkySmokeInstrumentedTest             --no-daemon 2>&1 | tee "$RUNNER_TEMP/ar-smoke-gradle.log"
          connected_status=${PIPESTATUS[0]}
          echo "::notice title=AR smoke Gradle status::connectedDebugAndroidTest status=${connected_status}"
          "$ADB" logcat -d -v time > "$RUNNER_TEMP/ar-smoke-logcat.txt" 2>/dev/null
          python3 - "$RUNNER_TEMP/ar-smoke-gradle.log" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          lines = path.read_text(errors="replace").splitlines() if path.exists() else []
          interesting = [
              line for line in lines
              if any(token in line for token in (
                  "FAILURE:", "Execution failed", "Exception", "error:", "No tests found",
                  "connectedDebugAndroidTest", "BUILD FAILED", "BUILD SUCCESSFUL", "ARSkySmoke"
              ))
          ]
          for line in interesting[-25:]:
              escaped = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")[:900]
              print(f"::notice title=AR smoke Gradle output::{escaped}")
          PY
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          files = sorted(glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True))
          print(f"Connected AndroidTest XML files: {len(files)}")
          for path in files[:20]:
              print(f"::notice title=AR smoke XML::{path}")
          tests = failures = errors = skipped = 0
          for path in files:
              root = ET.parse(path).getroot()
              for testcase in root.iter("testcase"):
                  if testcase.attrib.get("classname") == "com.alijafari.red.astronomy.ARSkySmokeInstrumentedTest":
                      tests += 1
                      failures += 1 if testcase.find("failure") is not None else 0
                      errors += 1 if testcase.find("error") is not None else 0
                      skipped += 1 if testcase.find("skipped") is not None else 0
          status = "PASS" if tests > 0 and failures == 0 and errors == 0 and skipped == 0 else "FAIL"
          print(f"ARSkySmokeInstrumentedTest: tests={tests} failures={failures} errors={errors} skipped={skipped} status={status}")
          print(f"::notice title=AR emulator smoke test::ARSkySmokeInstrumentedTest: tests={tests} failures={failures} errors={errors} skipped={skipped} status={status}")
          sys.exit(0 if status == "PASS" else 1)
          PY
          smoke_xml_status=$?
          set -e

          if grep -E "FATAL EXCEPTION|AndroidRuntime" "$RUNNER_TEMP/ar-smoke-logcat.txt"; then
            echo "Fatal exception detected during AR emulator smoke test"
            fatal_status=1
          else
            echo "No fatal exceptions found in logcat during AR emulator smoke test"
            echo "::notice title=AR emulator logcat::No fatal exceptions found in logcat during AR emulator smoke test"
            fatal_status=0
          fi

          if [ "$connected_status" -ne 0 ] || [ "$smoke_xml_status" -ne 0 ] || [ "$fatal_status" -ne 0 ]; then
            echo "connectedDebugAndroidTest status=$connected_status smoke_xml_status=$smoke_xml_status fatal_status=$fatal_status"
            exit 1
          fi

      - name: Upload emulator smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ar-emulator-smoke-results
          path: |
            ${{ runner.temp }}/ar-emulator-setup.log
            ${{ runner.temp }}/ar-emulator-startup.log
            ${{ runner.temp }}/ar-smoke-gradle.log
            ${{ runner.temp }}/ar-smoke-logcat.txt
            app/build/outputs/androidTest-results/connected/**/*.xml
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Clean up keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/keystore.jks"
