name: Build Android APK

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Grant execute permission for gradlew (if present)
        run: chmod +x gradlew || true

      - name: Decode Keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
            echo "Permanent signing keystore decoded."
          else
            echo "No signing secret configured; Gradle will fall back to the debug key."
          fi

      - name: Build APK with Gradle
        env:
          KEYSTORE_FILE_PATH: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          else
            gradle assembleDebug --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          fi

      # TEMPORARY diagnosis: CI raw logs are unreachable from the sandbox, so surface
      # the Gradle failure excerpt as check annotations (readable via the API).
      - name: Report build errors
        if: failure()
        run: |
          grep -E "FAILED|Execution failed|error:|FAILURE:|Caused by|What went wrong|Expected|Unresolved reference" "$RUNNER_TEMP/gradle-build.log" | head -n 30 | sed 's/%/%25/g' > "$RUNNER_TEMP/build-errors.txt" || true
          while IFS= read -r line; do
            echo "::error title=Gradle build failure::$(echo "$line" | head -c 800)"
          done < "$RUNNER_TEMP/build-errors.txt"

      - name: Diagnostic - List Generated APKs
        run: |
          echo "Generated APKs:"
          find app/build/outputs -type f

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Clean up keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/keystore.jks"
