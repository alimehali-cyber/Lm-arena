name: Showcase emulator smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/showcase-smoke.yml
      - app/src/androidTest/java/com/alijafari/red/astronomy/ShowcaseSmokeTest.kt
      - .github/scripts/showcase-smoke.sh

permissions:
  contents: read

jobs:
  showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
      - name: Inspect previous smoke report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 46052315065 -n showcase-smoke-report -D /tmp/old-report || exit 0
          python3 - <<'PYCODE'
          import pathlib, re, html
          for p in pathlib.Path('/tmp/old-report').rglob('*.html'):
              t = html.unescape(re.sub(r'<[^>]+>', ' ', p.read_text(errors='replace')))
              for line in t.splitlines():
                  if any(x in line for x in ('Exception', 'AssertionError', 'Error:', 'FAILED', 'Caused by:')):
                      print('::warning title=Previous showcase failure::' + line.strip().replace('%','%25')[:1500])
          PYCODE
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the complete showcase on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          script: bash .github/scripts/showcase-smoke.sh
      - name: Annotate test failures
        if: failure()
        run: |
          python3 - <<'PYCODE'
          import glob, pathlib, xml.etree.ElementTree as ET
          def emit(title, text):
              text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')[:4000]
              print(f'::error title={title}::{text}')
          for path in glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True):
              try:
                  for case in ET.parse(path).getroot().iter('testcase'):
                      for node in case:
                          if node.tag in ('failure', 'error'):
                              emit('Showcase test', (node.attrib.get('message', '') + ' ' + (node.text or ''))[:3500])
              except ET.ParseError:
                  pass
          for name in ('showcase-gradle.log', 'showcase-crash.log'):
              p = pathlib.Path(name)
              if p.exists():
                  lines = p.read_text(errors='replace').splitlines()
                  interesting = [line for line in lines if any(t in line for t in ('FAILED', 'FAILURE:', 'Execution failed', 'error:', 'Exception', 'Process crashed', 'FATAL EXCEPTION', 'BUILD FAILED'))]
                  for line in interesting[-20:]: emit(name, line)
          PYCODE
      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-smoke-report
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
