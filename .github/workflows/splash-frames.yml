name: Splash preview render

# Renders the launch splash with Android's own graphics stack (Robolectric native graphics) and
# publishes it as review frames plus a 30 fps MP4, so motion changes can be reviewed without a
# device. Runs only when the splash (or this workflow) changes.
on:
  push:
    paths:
      - "app/src/main/java/com/alijafari/red/astronomy/ui/components/PremiumSplashScreen.kt"
      - "app/src/main/java/com/alijafari/red/astronomy/ui/splash/**"
      - "app/src/main/res/drawable-nodpi/splash_*"
      - "app/src/test/java/com/alijafari/red/astronomy/SplashFramesRenderTest.kt"
      - ".github/workflows/splash-frames.yml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Render the splash
        env:
          SPLASH_FRAMES_DENSE: "true"
        run: |
          chmod +x gradlew || true
          ./gradlew testDebugUnitTest --tests '*SplashFramesRenderTest*' \
            -Proborazzi.test.record=true -Pgravity.ci.tests=false --no-daemon

      - name: Encode the 30 fps preview
        run: |
          set -euo pipefail
          cd app/build/outputs/splash-frames
          ls | head -50
          count=$(ls dense_*.png 2>/dev/null | wc -l)
          echo "dense frames: $count"
          if [ "$count" -gt 0 ]; then
            ffmpeg -loglevel error -y -framerate 30 -pattern_type glob -i 'dense_*.png' \
              -vf "pad=ceil(iw/2)*2:ceil(ih/2)*2" -c:v libx264 -pix_fmt yuv420p -crf 18 ../splash-preview.mp4
            mkdir -p ../splash-review && cp ../splash-preview.mp4 ../splash-review/
          fi
          mkdir -p ../splash-review && cp phone_*.png phone-land_*.png tablet_*.png ../splash-review/ 2>/dev/null || true
          ls -la ../splash-review

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: splash-preview
          path: app/build/outputs/splash-review
          if-no-files-found: error
