name: Splash preview render

# Renders the launch splash with Android's own graphics stack (Robolectric native graphics) and
# publishes review frames, contact sheets and a 30 fps MP4 to docs/splash-preview/ on the same
# branch, so motion changes can be reviewed without a device. Runs only when the splash changes.
on:
  push:
    paths:
      - "app/src/main/java/com/alijafari/red/astronomy/ui/components/PremiumSplashScreen.kt"
      - "app/src/main/java/com/alijafari/red/astronomy/ui/splash/**"
      - "app/src/main/res/drawable-nodpi/splash_*"
      - "app/src/test/java/com/alijafari/red/astronomy/SplashFramesRenderTest.kt"
      - ".github/workflows/splash-frames.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Render the splash
        env:
          SPLASH_FRAMES_DENSE: "true"
        run: |
          chmod +x gradlew || true
          ./gradlew testDebugUnitTest --tests '*SplashFramesRenderTest*' \
            -Proborazzi.test.record=true -Pgravity.ci.tests=false --no-daemon

      - name: Install ffmpeg
        if: always()
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null

      - name: Collect review frames, contact sheet and 30 fps preview
        if: always()
        run: |
          set -u
          out=docs/splash-preview
          rm -rf "$out" && mkdir -p "$out"
          {
            echo "## rendered frame files"
            find app -name '*.png' -path '*splash-frames*' | sort
            echo
            echo "## SplashFramesRenderTest results"
            cat app/build/test-results/testDebugUnitTest/TEST-*SplashFramesRenderTest*.xml 2>/dev/null | head -300
          } > "$out/render-log.txt" 2>&1 || true
          first=$(find app -name 'phone_0000ms.png' -path '*splash-frames*' | head -1)
          [ -z "$first" ] && { echo "no frames rendered"; exit 0; }
          src=$(dirname "$first")
          for f in "$src"/phone_*.png "$src"/phone-land_*.png "$src"/tablet_*.png; do
            [ -f "$f" ] || continue
            ffmpeg -loglevel error -y -i "$f" -vf "scale=iw/2:-2" -q:v 3 "$out/$(basename "${f%.png}").jpg"
          done
          # One overview image of the phone timeline (6 x 3 tiles).
          ffmpeg -loglevel error -y -pattern_type glob -i "$src/phone_*.png" \
            -vf "scale=270:-2,tile=6x3:padding=6:color=0x101010" -frames:v 1 -q:v 3 "$out/contact-sheet-phone.jpg" || true
          if ls "$src"/dense_*.png >/dev/null 2>&1; then
            ffmpeg -loglevel error -y -framerate 30 -pattern_type glob -i "$src/dense_*.png" \
              -vf "pad=ceil(iw/2)*2:ceil(ih/2)*2" -c:v libx264 -pix_fmt yuv420p -crf 20 -movflags +faststart \
              "$out/splash-preview.mp4"
            # Dense contact sheet: every 4th frame (~133 ms apart) for motion review.
            ffmpeg -loglevel error -y -framerate 30 -pattern_type glob -i "$src/dense_*.png" \
              -vf "select='not(mod(n\,4))',scale=180:-2,tile=8x4:padding=4:color=0x101010" -frames:v 1 -q:v 3 \
              "$out/contact-sheet-motion.jpg" || true
          fi
          ls -la "$out"

      - name: Publish beside the design docs
        if: always()
        run: |
          git config user.name "splash-preview-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/splash-preview
          git diff --cached --quiet && { echo "nothing to publish"; exit 0; }
          git commit -m "docs(splash): rendered preview frames for ${GITHUB_SHA::7}"
          for i in 1 2 3; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
